name: Secret Scan

# Fails when a credential-looking string (API keys, private keys, tokens, connection strings
# with passwords...) appears anywhere in the git history. Runs the gitleaks CLI directly
# rather than gitleaks-action, which needs a paid license for organization-owned repos - so
# projects created from this template keep working wherever they live. The release archive
# is pinned by version and SHA-256 (from the release's checksums file); bump both together.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      # Every commit, not just this PR's: a secret removed in a later commit is still leaked.
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
