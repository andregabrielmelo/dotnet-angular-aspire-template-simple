name: PR Conventions

# Enforces the repo's Git workflow rules (CONTRIBUTING.md, CLAUDE.md "Git workflow"):
# gitflow branch naming/targets and Conventional Commits messages. Plain shell, no
# third-party actions - PR-controlled values are passed through env, never interpolated
# into the script.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitflow:
    name: Gitflow branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check source/target branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            main) allowed='^(release/[0-9A-Za-z.\-]+|hotfix/[a-z0-9.\-]+)$' ;;
            develop) allowed='^(feature/[a-z0-9\-]+|release/[0-9A-Za-z.\-]+|hotfix/[a-z0-9.\-]+|dependabot/.+)$' ;;
            *) echo "PRs must target main or develop (gitflow), not '$BASE_REF'."; exit 1 ;;
          esac
          if ! grep -Eq "$allowed" <<< "$HEAD_REF"; then
            echo "Branch '$HEAD_REF' can't be merged into '$BASE_REF'."
            echo "Into develop: feature/<kebab-name> (also release/*, hotfix/* back-merges, dependabot/*)."
            echo "Into main: release/<version> or hotfix/<name> only."
            exit 1
          fi
          echo "OK: $HEAD_REF -> $BASE_REF"

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: [^ ].*[^.]$'
          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"; subject="${line#* }"
            if ! grep -Eq "$pattern" <<< "$subject"; then
              echo "::error::${sha:0:7} \"$subject\" is not a Conventional Commit (<type>[(scope)][!]: <description>)."
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          if [ "$failed" -ne 0 ]; then
            echo "See https://www.conventionalcommits.org/en/v1.0.0/ - reword with 'git rebase -i' and force-push."
            exit 1
          fi
          echo "All commit messages follow Conventional Commits."
