<div class="mx-auto max-w-2xl p-6">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-semibold">Users</h1>
    <a routerLink="/home" class="text-sm text-blue-600 underline">Back</a>
  </div>

  @if (errorMessage(); as message) {
    <p class="mb-4 text-sm text-red-600" role="alert">{{ message }}</p>
  }

  <ul class="divide-y divide-gray-200 rounded-md border border-gray-200">
    @for (user of users(); track user.id) {
      <li class="flex items-center justify-between px-4 py-2 text-sm">
        <span>#{{ user.id }} · {{ user.name }}</span>
        @if (canDelete()) {
          <button
            type="button"
            (click)="deleteUser(user)"
            class="rounded-md border border-red-300 px-3 py-1 text-red-700"
          >
            Delete
          </button>
        }
      </li>
    } @empty {
      <li class="px-4 py-2 text-sm text-gray-600">No users.</li>
    }
  </ul>
</div>
