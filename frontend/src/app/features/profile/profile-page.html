<div class="mx-auto max-w-sm p-6">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-semibold">Your profile</h1>
    <a routerLink="/home" class="text-sm text-blue-600 underline">Back</a>
  </div>

  @if (profile(); as profile) {
    <p class="mb-6 text-sm text-gray-600">{{ profile.email }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium">Name</label>
      <input
        id="name"
        type="text"
        autocomplete="name"
        formControlName="name"
        [attr.aria-describedby]="
          form.controls.name.touched && form.controls.name.invalid ? 'name-error' : null
        "
        class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p id="name-error" class="mt-1 text-sm text-red-600">
          Enter a name of up to 100 characters.
        </p>
      }
    </div>

    @if (errorMessage(); as message) {
      <p class="text-sm text-red-600" role="alert">{{ message }}</p>
    }
    @if (status() === 'saved') {
      <p class="text-sm text-green-700" role="status">Profile saved.</p>
    }

    <button
      type="submit"
      [disabled]="status() === 'saving'"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
    >
      {{ status() === 'saving' ? 'Saving…' : 'Save' }}
    </button>
  </form>
</div>
