<div class="mx-auto max-w-sm p-6">
  <h1 class="mb-2 text-2xl font-semibold">Welcome</h1>
  <p class="mb-6 text-sm text-gray-600">Sign in or create an account to continue.</p>

  <div class="space-y-3">
    <button
      type="button"
      (click)="login()"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white"
    >
      Sign in
    </button>
    <button
      type="button"
      (click)="register()"
      class="w-full rounded-md border border-gray-300 px-4 py-2 text-sm font-medium"
    >
      Create account
    </button>
  </div>

  <p class="mt-4 text-center text-sm text-gray-600">
    Forgot your password? Choose Sign in, then use the reset link on the sign-in page.
  </p>
</div>
